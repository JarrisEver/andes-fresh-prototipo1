<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Andes Fresh</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/data.js"></script>
    <script src="../js/app.js"></script>
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <div class="login-logo">
                Andes <span>Fresh</span>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Usuario / Correo</label>
                    <input type="email" id="email" class="form-control" placeholder="admin@andesfresh.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="123" required>
                </div>
                <div class="form-group flex-between">
                    <label style="font-weight: normal; margin: 0;">
                        <input type="checkbox"> Recordarme
                    </label>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Iniciar Sesión</button>
                <div id="login-error" class="error-msg"></div>
                
                <div style="margin-top: 20px; font-size: 12px; color: var(--text-muted); text-align: center;">
                    <p>Usuarios de prueba (pwd: 123):</p>
                    <p>admin@andesfresh.com</p>
                    <p>vendedor@andesfresh.com</p>
                    <p>gerencia@andesfresh.com</p>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
